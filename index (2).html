<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="جسر: منصة لفرق العمل عن بعد لنقل الملفات بين الإدارات وحساب رواتب الموظفين والمحادثة ولوحة للإدارة العامة.">
<title>جسر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column that mirrors with the language. Hero text, a working product window with four tabs, one pricing plan. Two overlays: first-visit intro and language picker. */
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --surface-2: #E8EEF3;
  --ink: #0F2A3D;
  --ink-2: #4A6072;
  --line: #D5DEE6;
  --accent: #E8A317;
  --on-accent: #2A1C00;
  --btn-bg: #0F2A3D;
  --btn-fg: #FFFFFF;
  --good: #1B6E4A;
  --good-bg: #DCF0E5;
  --warn: #8A5200;
  --warn-bg: #FBEBCB;
  --bad: #A8322B;
  --bad-bg: #F8DDDA;
  --mine: #DDE8F3;
  --scrim: rgba(7, 14, 21, 0.6);
  --font-display: "Bricolage Grotesque", "Reem Kufi", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B141D;
    --surface: #121F2B;
    --surface-2: #192A39;
    --ink: #E7EEF5;
    --ink-2: #9DB0C1;
    --line: #243747;
    --accent: #F0B43C;
    --on-accent: #2A1C00;
    --btn-bg: #E7EEF5;
    --btn-fg: #0B141D;
    --good: #6FD0A0;
    --good-bg: #163527;
    --warn: #F0B43C;
    --warn-bg: #3A2C0E;
    --bad: #F08A82;
    --bad-bg: #3A1A18;
    --mine: #1B3247;
    --scrim: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B141D;
  --surface: #121F2B;
  --surface-2: #192A39;
  --ink: #E7EEF5;
  --ink-2: #9DB0C1;
  --line: #243747;
  --accent: #F0B43C;
  --on-accent: #2A1C00;
  --btn-bg: #E7EEF5;
  --btn-fg: #0B141D;
  --good: #6FD0A0;
  --good-bg: #163527;
  --warn: #F0B43C;
  --warn-bg: #3A2C0E;
  --bad: #F08A82;
  --bad-bg: #3A1A18;
  --mine: #1B3247;
  --scrim: rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html.lock { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  direction: rtl;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:root[dir="ltr"] body { direction: ltr; }
.wrap { max-width: 1080px; margin-inline: auto; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 20px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 26px; text-decoration: none; color: var(--ink); }
.logo svg { width: 34px; height: 24px; }
.nav { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
.nav a, .linklike { color: var(--ink-2); text-decoration: none; font-size: 15px; }
.nav a:hover, .linklike:hover { color: var(--ink); }
.linklike { border: 0; background: transparent; cursor: pointer; padding: 0; }
.nav a.btn { color: var(--btn-fg); }
.langbtn { display: inline-flex; align-items: center; gap: 6px; }
.langbtn svg { width: 18px; height: 18px; }
.langbtn span { font-family: var(--font-num); font-size: 13px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 14px; font-size: 14px; margin-bottom: 8px; }

/* buttons */
.btn { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; display: inline-block; line-height: 1.5; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: transparent; }
.btn.accent { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.small { padding: 4px 12px; font-size: 14px; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }

/* hero */
.hero { padding-block: 36px 32px; display: grid; gap: 20px; }
.hero h1 { font-size: clamp(32px, 5.4vw, 54px); font-weight: 700; max-width: 15em; }
.hero p { color: var(--ink-2); font-size: 18px; max-width: 38em; }
.hero .cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

/* product window */
.demo-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; }
.demo-head h2 { font-size: 24px; }
.tag { font-size: 13px; padding: 2px 10px; border-radius: 20px; background: var(--warn-bg); color: var(--warn); }
.window { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); background: var(--surface-2); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 10px 18px; cursor: pointer; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.panel { padding: 20px; }
.panel h3 { font-size: 19px; margin-bottom: 4px; }
.sub { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }
.sec { font-size: 17px; margin: 24px 0 10px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--bg); }
.box h3 { font-size: 17px; margin-bottom: 10px; }

/* forms */
.field { display: grid; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field label { font-size: 14px; color: var(--ink-2); }
input[type="text"], input[type="number"], input[type="email"], input[type="search"], input[type="file"], select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0;
}
input[type="file"] { padding: 6px; font-size: 14px; }
.err { color: var(--bad); font-size: 14px; min-height: 1.4em; margin-bottom: 6px; }

/* files and lists */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 4px 14px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-fg); border-color: transparent; }
.count { font-family: var(--font-num); font-size: 12px; background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 0 7px; line-height: 1.6; }
.files { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.file { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); }
.file.one { grid-template-columns: minmax(0, 1fr); }
.file-name { font-weight: 500; overflow-wrap: anywhere; }
.file-meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13px; color: var(--ink-2); }
.ann-body { font-size: 14px; color: var(--ink-2); }
.ref { font-family: var(--font-num); font-size: 12px; color: var(--ink-2); direction: ltr; unicode-bidi: isolate; }
.file-side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 13px; padding: 1px 10px; border-radius: 20px; white-space: nowrap; }
.pill.pending { background: var(--warn-bg); color: var(--warn); }
.pill.received, .pill.approved { background: var(--good-bg); color: var(--good); }
.pill.rejected { background: var(--bad-bg); color: var(--bad); }
.empty { color: var(--ink-2); padding: 18px 4px; }

/* payroll and tables */
.rates { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; margin-bottom: 14px; }
.rates .field { margin: 0; width: 150px; }
.totals { display: flex; flex-wrap: wrap; gap: 10px 36px; margin: 14px 0; }
.total span { display: block; font-size: 13px; color: var(--ink-2); }
.total b { font-family: var(--font-num); font-weight: 500; font-size: 22px; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 15px; }
table.gm-table { min-width: 460px; }
th, td { padding: 8px 12px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--ink-2); font-size: 13px; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: end; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
th.num { font-family: var(--font-body); }
td input { width: 76px; padding: 4px 8px; font-family: var(--font-num); text-align: end; }
td .dept { display: block; font-size: 12px; color: var(--ink-2); }
td.net { font-weight: 500; }
.formula { font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.add { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; align-items: end; margin-top: 16px; }
.add .field { margin: 0; }

/* chat */
.chat { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 20px; }
.channels { display: grid; gap: 4px; align-content: start; }
.channel { text-align: start; border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-2); }
.channel[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.msgs { height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); align-self: flex-start; }
.msg.mine { align-self: flex-end; background: var(--mine); }
.msg .who { font-size: 12px; color: var(--ink-2); display: flex; gap: 10px; }
.msg .who time { font-family: var(--font-num); }
.send { display: flex; gap: 10px; margin-top: 10px; }
.send input { flex: 1; }

/* pricing */
.pricing { padding-block: 64px 8px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 36px; align-items: start; }
.pricing h2 { font-size: clamp(26px, 4vw, 38px); margin-bottom: 12px; }
.pricing .lead { color: var(--ink-2); max-width: 30em; }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
.plan .name { color: var(--ink-2); font-size: 15px; }
.price { font-family: var(--font-num); font-size: 52px; font-weight: 500; line-height: 1.2; margin: 6px 0 2px; }
.price small { font-family: var(--font-body); font-size: 16px; color: var(--ink-2); margin-inline-start: 8px; }
.plan ul { list-style: none; padding: 0; margin: 18px 0 22px; display: grid; gap: 10px; }
.plan li { display: flex; gap: 10px; align-items: baseline; }
.plan li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-1px); }
.plan .btn { width: 100%; text-align: center; padding: 11px 18px; }
.checkout { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
.note { font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.done { background: var(--good-bg); color: var(--good); padding: 12px 14px; border-radius: 10px; }

footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 14px; }

/* overlays */
.ov {
  position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#lang-ov { z-index: 60; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 580px; max-height: 100%; overflow: auto; padding: 28px; position: relative; }
.card h2 { font-size: 28px; margin: 14px 0 10px; padding-inline-end: 36px; }
.card .lead2 { color: var(--ink-2); }
.x { position: absolute; top: 12px; inset-inline-end: 12px; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; font-size: 22px; line-height: 1; color: var(--ink-2); }
.x:hover { background: var(--surface-2); color: var(--ink); }
.stats { display: flex; flex-wrap: wrap; gap: 12px 30px; margin: 20px 0; }
.stat b { font-family: var(--font-num); font-size: 26px; font-weight: 500; display: block; line-height: 1.2; }
.stat span { font-size: 13px; color: var(--ink-2); }
.quick-lab { font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
.card .chips { margin-bottom: 22px; }
.card.lang { display: flex; flex-direction: column; overflow: hidden; max-height: min(680px, 100%); }
.card.lang h2 { margin-top: 0; font-size: 24px; }
.langs { list-style: none; margin: 12px 0 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
.lang-item { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; width: 100%; text-align: start; padding: 9px 10px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; }
.lang-item:hover, .lang-item[aria-pressed="true"] { background: var(--surface-2); }
.lang-item[aria-pressed="true"] .ln { font-weight: 600; }
.ln { flex: 1; min-width: 0; }
.lm { color: var(--ink-2); font-size: 13px; }
.lc { font-family: var(--font-num); font-size: 12px; color: var(--ink-2); min-width: 32px; text-align: end; }
.lang-meta { font-size: 13px; color: var(--ink-2); margin-top: 10px; }

@media (max-width: 800px) {
  .cols, .pricing { grid-template-columns: minmax(0, 1fr); }
  .chat { grid-template-columns: minmax(0, 1fr); }
  .channels { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
  .panel { padding: 14px; }
  .msg { max-width: 92%; }
  .card { padding: 22px 18px; }
}
[hidden] { display: none !important; }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#top-of-page">
      <svg viewBox="0 0 34 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 20h30M5 20C8 6 26 6 29 20M12 20v-8M17 20V9M22 20v-8"/></svg>
      <span data-i="brand"></span>
    </a>
    <nav class="nav" data-al="nav.aria">
      <a href="#demo" data-i="nav.demo"></a>
      <a href="#pricing" data-i="nav.pricing"></a>
      <button class="linklike" id="about-btn" type="button" data-i="nav.about"></button>
      <button class="btn small langbtn" id="lang-btn" type="button" aria-haspopup="dialog" data-al="lang.open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        <span id="lang-code"></span>
      </button>
      <a class="btn primary small" href="#pricing" data-i="nav.subscribe"></a>
    </nav>
  </header>

  <div class="banner" id="notice" role="status" hidden>
    <span id="notice-t"></span>
    <button class="x" style="position: static" id="notice-x" type="button" data-al="intro.close">×</button>
  </div>

  <section class="hero" id="top-of-page">
    <h1 data-i="hero.h1"></h1>
    <p data-i="hero.p"></p>
    <div class="cta">
      <a class="btn accent" href="#pricing" data-i="hero.cta1"></a>
      <a class="btn" href="#demo" data-i="hero.cta2"></a>
    </div>
  </section>

  <section id="demo" aria-labelledby="demo-title">
    <div class="demo-head">
      <h2 id="demo-title" data-i="demo.company"></h2>
      <span class="tag" data-i="demo.tag"></span>
    </div>

    <div class="window">
      <div class="tabs" role="tablist" data-al="tabs.aria">
        <button class="tab" role="tab" id="tab-files" aria-controls="panel-files" aria-selected="true" data-tab="files" data-i="tab.files"></button>
        <button class="tab" role="tab" id="tab-pay" aria-controls="panel-pay" aria-selected="false" data-tab="pay" tabindex="-1" data-i="tab.pay"></button>
        <button class="tab" role="tab" id="tab-chat" aria-controls="panel-chat" aria-selected="false" data-tab="chat" tabindex="-1" data-i="tab.chat"></button>
        <button class="tab" role="tab" id="tab-gm" aria-controls="panel-gm" aria-selected="false" data-tab="gm" tabindex="-1" data-i="tab.gm"></button>
      </div>

      <!-- files -->
      <div class="panel" id="panel-files" role="tabpanel" aria-labelledby="tab-files">
        <h3 data-i="files.h"></h3>
        <p class="sub" data-i="files.sub"></p>
        <div class="cols">
          <div>
            <div class="chips" id="chips" role="group" data-al="files.filterAria"></div>
            <ul class="files" id="files"></ul>
          </div>
          <form class="box" id="send-form" novalidate>
            <h3 data-i="files.sendH"></h3>
            <div class="field"><label for="file-input" data-i="files.file"></label><input type="file" id="file-input"></div>
            <div class="field"><label for="from" data-i="files.from"></label><select id="from"></select></div>
            <div class="field"><label for="to" data-i="files.to"></label><select id="to"></select></div>
            <div class="err" id="send-err" role="alert"></div>
            <button class="btn primary" type="submit" data-i="files.send"></button>
          </form>
        </div>
      </div>

      <!-- payroll -->
      <div class="panel" id="panel-pay" role="tabpanel" aria-labelledby="tab-pay" hidden>
        <h3 data-i="pay.h"></h3>
        <p class="sub" data-i="pay.sub"></p>
        <div class="rates">
          <div class="field"><label for="rate-tax" data-i="pay.tax"></label><input type="number" id="rate-tax" min="0" max="60" step="1" value="10"></div>
          <div class="field"><label for="rate-ins" data-i="pay.ins"></label><input type="number" id="rate-ins" min="0" max="40" step="1" value="9"></div>
        </div>
        <div class="totals" aria-live="polite">
          <div class="total"><span data-i="pay.tGross"></span><b id="t-gross"></b></div>
          <div class="total"><span data-i="pay.tDed"></span><b id="t-ded"></b></div>
          <div class="total"><span data-i="pay.tNet"></span><b id="t-net"></b></div>
        </div>
        <div class="scroll">
          <table>
            <thead><tr>
              <th data-i="pay.cEmp"></th><th data-i="pay.country"></th><th class="num" data-i="pay.cBase"></th><th class="num" data-i="pay.cDays"></th><th class="num" data-i="pay.cOt"></th><th class="num" data-i="pay.cBonus"></th><th class="num" data-i="pay.cDed"></th><th class="num" data-i="pay.cNet"></th><th></th>
            </tr></thead>
            <tbody id="pay-body"></tbody>
          </table>
        </div>
        <p class="formula" data-i="pay.formula"></p>
        <form class="add" id="add-form" novalidate>
          <div class="field"><label for="e-name" data-i="pay.name"></label><input type="text" id="e-name" data-ph="pay.namePh"></div>
          <div class="field"><label for="e-dept" data-i="pay.dept"></label><select id="e-dept"></select></div>
          <div class="field"><label for="e-country" data-i="pay.country"></label><select id="e-country"></select></div>
          <div class="field"><label for="e-base" data-i="pay.cBase"></label><input type="number" id="e-base" min="0" step="50" placeholder="2500"></div>
          <button class="btn primary" type="submit" data-i="pay.add"></button>
        </form>
        <div class="err" id="add-err" role="alert"></div>
      </div>

      <!-- chat -->
      <div class="panel" id="panel-chat" role="tabpanel" aria-labelledby="tab-chat" hidden>
        <h3 data-i="chat.h"></h3>

  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  function showTab(name) {
    tabs.forEach(function (tb) {
      var on = tb.dataset.tab === name;
      tb.setAttribute("aria-selected", on ? "true" : "false");
      tb.tabIndex = on ? 0 : -1;
      $("panel-" + tb.dataset.tab).hidden = !on;
    });
    if (name === "chat") scrollMsgs();
  }
  tabs.forEach(function (tb, i) {
    tb.addEventListener("click", function () { showTab(tb.dataset.tab); });
    tb.addEventListener("keydown", function (e) {
      var rtl = document.documentElement.dir === "rtl";
      var d = e.key === "ArrowLeft" ? (rtl ? 1 : -1) : e.key === "ArrowRight" ? (rtl ? -1 : 1) : 0;
      if (!d) return;
      var n = tabs[(i + d + tabs.length) % tabs.length];
      n.focus(); showTab(n.dataset.tab);
    });
  });

  /* files */
  function fmtSize(b) { return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1048576).toFixed(1) + " MB"; }
  function renderFiles() {
    var chips = $("chips");
    chips.replaceChildren();
    function chip(key, label, count) {
      chips.append(h("button", { class: "chip", type: "button", "aria-pressed": filter === key ? "true" : "false", onclick: function () { filter = key; renderFiles(); } },
        label, count ? h("span", { class: "count" }, String(count)) : null));
    }
    chip("all", t("files.all"), 0);
    KEYS.forEach(function (k) {
      var c = files.filter(function (f) { return f.to === k && f.status === "pending"; }).length;
      chip(k, t("d." + k), c);
    });
    var list = $("files");
    list.replaceChildren();
    var shown = files.filter(function (f) { return filter === "all" || f.to === filter; });
    if (!shown.length) list.append(h("li", { class: "empty" }, t("files.empty")));
    shown.forEach(function (f) {
      var side = h("div", { class: "file-side" }, h("span", { class: "pill " + f.status }, t(f.status === "pending" ? "files.pending" : "files.received")));
      if (f.status === "pending") {
        side.append(h("button", { class: "btn small", type: "button", onclick: function () { f.status = "received"; renderFiles(); } }, t("files.confirm")));
      }
      list.append(h("li", { class: "file" },
        h("div", {},
          h("div", { class: "file-name" }, f.name),
          h("div", { class: "file-meta" },
            h("span", {}, t("files.route", { a: t("d." + f.from), b: t("d." + f.to) })),
            h("span", { class: "mono" }, f.size),
            h("span", { class: "mono" }, f.date),
            h("span", { class: "ref" }, "#" + f.id))),
        side));
    });
    renderGMNumbers();
  }
  $("file-input").addEventListener("change", function () { $("send-err").textContent = ""; });
  $("send-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = $("send-err"); err.textContent = "";
    var f = $("file-input").files[0];
    var from = $("from").value, to = $("to").value;
    if (!f) { err.textContent = t("files.errNoFile"); return; }
    if (from === to) { err.textContent = t("files.errSame"); return; }
    counter += 1;
    files.unshift({ id: "2026-0" + counter, name: f.name, size: fmtSize(f.size), from: from, to: to, status: "pending", date: nowDate() });
    $("file-input").value = "";
    filter = to;
    renderFiles();
  });

  /* payroll */
  function calc(e) {
    var daily = e.base / 30;
    var gross = daily * e.days + (daily / 8) * 1.5 * e.ot + e.bonus;
    var ded = gross * (rates.tax + rates.ins) / 100;
    return { gross: gross, ded: ded, net: gross - ded };
  }
  function updatePay() {
    var g = 0, d = 0, n = 0;
    emps.forEach(function (e, i) {
      var r = calc(e);
      cells[i].ded.textContent = money(r.ded);
      cells[i].net.textContent = money(r.net);
      g += r.gross; d += r.ded; n += r.net;
    });
    $("t-gross").textContent = money(g);
    $("t-ded").textContent = money(d);
    $("t-net").textContent = money(n);
    renderGMNumbers();
  }
  var COLKEY = { days: "pay.cDays", ot: "pay.cOt", bonus: "pay.cBonus" };
  function numInput(e, key, min, max, step) {
    var inp = h("input", { type: "number", min: min, max: max, step: step, value: String(e[key]), "aria-label": e.n + " " + t(COLKEY[key]) });
    inp.addEventListener("input", function () {
      var v = parseFloat(inp.value);
      if (isNaN(v)) v = 0;
      e[key] = Math.min(max, Math.max(min, v));
      updatePay();
    });
    return inp;
  }
  function buildPay() {
    var body = $("pay-body");
    body.replaceChildren();
    cells = [];
    emps.forEach(function (e, i) {
      var ded = h("td", { class: "num" }), net = h("td", { class: "num net" });
      cells.push({ ded: ded, net: net });
      body.append(h("tr", {},
        h("td", {}, e.n, h("span", { class: "dept" }, t("d." + e.d))),
        h("td", {}, regionName(e.c)),
        h("td", { class: "num" }, money(e.base)),
        h("td", { class: "num" }, numInput(e, "days", 0, 30, 1)),
        h("td", { class: "num" }, numInput(e, "ot", 0, 200, 1)),
        h("td", { class: "num" }, numInput(e, "bonus", 0, 100000, 50)),
        ded, net,
        h("td", {}, h("button", { class: "btn small quiet", type: "button", "aria-label": t("pay.del") + " " + e.n, onclick: function () { emps.splice(i, 1); buildPay(); } }, t("pay.del")))));
    });
    updatePay();
  }
  function rateInput(id, key, max) {
    $(id).addEventListener("input", function () {
      var v = parseFloat($(id).value);
      rates[key] = isNaN(v) ? 0 : Math.min(max, Math.max(0, v));
      updatePay();
    });
  }
  rateInput("rate-tax", "tax", 60); rateInput("rate-ins", "ins", 40);
  $("add-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var err = $("add-err"); err.textContent = "";
    var name = $("e-name").value.trim();
    var base = parseFloat($("e-base").value);
    if (!name || !(base > 0)) { err.textContent = t("pay.err"); return; }
    emps.push({ n: name, d: $("e-dept").value, c: $("e-country").value, base: base, days: 30, ot: 0, bonus: 0 });
    $("e-name").value = ""; $("e-base").value = "";
    buildPay();
  });

  /* chat */
  function chanLabel(k) { return k === "general" ? t("chat.general") : t("d." + k); }
  function scrollMsgs() { var m = $("msgs"); m.scrollTop = m.scrollHeight; }
  function renderChat() {
    var cs = $("channels"); cs.replaceChildren();
    ["general"].concat(KEYS).forEach(function (k) {
      cs.append(h("button", { class: "channel", type: "button", "aria-pressed": chan === k ? "true" : "false", onclick: function () { chan = k; renderChat(); } }, chanLabel(k)));
    });
    var box = $("msgs"); box.replaceChildren();
    if (!chat[chan].length) box.append(h("p", { class: "empty" }, t("chat.empty", { c: chanLabel(chan) })));
    chat[chan].forEach(function (x) {
      box.append(h("div", { class: "msg" + (x.mine ? " mine" : "") },
        h("div", { class: "who" }, h("span", {}, x.ak ? t(x.ak) : x.a), h("time", {}, x.t)),
        h("div", {}, x.k ? t(x.k) : x.m)));
    });
    scrollMsgs();
  }
  $("chat-input").addEventListener("input", function () { $("chat-err").textContent = ""; });
  $("chat-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("chat-input").value.trim();
    if (!v) { $("chat-err").textContent = t("chat.err"); return; }
    chat[chan].push({ ak: "chat.me", t: nowTime(), m: v, mine: true });
    $("chat-input").value = "";
    renderChat();
  });

  /* general management */
  function renderGMNumbers() {
    var net = 0;
    emps.forEach(function (e) { net += calc(e).net; });
    $("k-emps").textContent = emps.length;
    $("k-pay").textContent = money(net);
    $("k-files").textContent = files.filter(function (f) { return f.status === "pending"; }).length;
    $("k-appr").textContent = approvals.filter(function (a) { return a.s === "pending"; }).length;
    var body = $("gm-body");
    body.replaceChildren();
    KEYS.forEach(function (k) {
      var list = emps.filter(function (e) { return e.d === k; });
      var sum = 0; list.forEach(function (e) { sum += calc(e).net; });
      var pend = files.filter(function (f) { return f.to === k && f.status === "pending"; }).length;
      body.append(h("tr", {}, h("td", {}, t("d." + k)), h("td", { class: "num" }, String(list.length)), h("td", { class: "num" }, money(sum)), h("td", { class: "num" }, String(pend))));
    });
  }
  function setAppr(a, s) { a.s = s; renderGMLists(); renderGMNumbers(); }
  function renderGMLists() {
    var list = $("appr");
    list.replaceChildren();
    approvals.forEach(function (a) {
      var side = h("div", { class: "file-side" });
      if (a.s === "pending") {
        side.append(
          h("button", { class: "btn small primary", type: "button", onclick: function () { setAppr(a, "approved"); } }, t("gm.approve")),
          h("button", { class: "btn small", type: "button", onclick: function () { setAppr(a, "rejected"); } }, t("gm.reject")));
      } else {
        side.append(
          h("span", { class: "pill " + a.s }, t(a.s === "approved" ? "gm.sApproved" : "gm.sRejected")),
          h("button", { class: "btn small quiet", type: "button", onclick: function () { setAppr(a, "pending"); } }, t("gm.undo")));
      }
      list.append(h("li", { class: "file" },
        h("div", {},
          h("div", { class: "file-name" }, t(a.k)),
          h("div", { class: "file-meta" }, h("span", {}, t("gm.reqBy", { d: t("d." + a.d) })), a.amt ? h("span", { class: "mono" }, money0(a.amt)) : null)),
        side));
    });
    var al = $("ann-list");
    al.replaceChildren();
    anns.forEach(function (a) {
      al.append(h("li", { class: "file one" },
        h("div", {},
          h("div", { class: "file-name" }, a.tk ? t(a.tk) : a.title),
          h("div", { class: "ann-body" }, a.bk ? t(a.bk) : a.body),
          h("div", { class: "file-meta" }, h("span", {}, a.to === "all" ? t("gm.annAll") : t("d." + a.to)), h("span", { class: "mono" }, a.date)))));
    });
  }
  $("ann-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = $("ann-err"); err.textContent = "";
    var title = $("ann-title").value.trim(), body = $("ann-body").value.trim(), to = $("ann-to").value;
    if (!title || !body) { err.textContent = t("gm.annErr"); return; }
    anns.unshift({ title: title, body: body, to: to, date: nowDate() });
    chat[to === "all" ? "general" : to].push({ ak: "d.gm", t: nowTime(), m: title + ": " + body });
    $("ann-title").value = ""; $("ann-body").value = "";
    renderGMLists(); renderChat();
  });

  /* checkout (demo only) */
  $("buy").addEventListener("click", function () {
    var c = $("checkout");
    c.hidden = !c.hidden;
    $("buy").setAttribute("aria-expanded", c.hidden ? "false" : "true");
    if (!c.hidden) $("co-name").focus();
  });
  $("buy-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("co-name").value.trim(), mail = $("co-mail").value.trim();
    var err = $("buy-err"); err.textContent = "";
    if (!name) { err.textContent = t("co.errName"); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { err.textContent = t("co.errMail"); return; }
    var done = $("buy-done");
    done.textContent = t("co.done", { n: name, c: regionName($("co-country").value) });
    done.hidden = false;
    $("buy-form").hidden = true;
  });

  /* start */
  var start = sget("jisr-lang");
  if (!start || LANGS.indexOf(start) < 0) {
    var nl = (navigator.language || "ar").toLowerCase();
    var pc = nl.split("-")[0];
    start = I18N[pc] ? pc : "en";
  }
  setLang(start);
  $("from").value = "sales"; $("to").value = "finance";
  if (!sget("jisr-intro")) openOv("intro", $("about-btn"));
})();
</script>
</body>
</html>
